name: Supabase keep-alive

# Supabase Free-tier projects are paused after ~7 days without any requests.
# This workflow makes one lightweight request every couple of days so the
# project never sits idle long enough to be paused. It runs on a schedule from
# the default branch, and can also be triggered manually from the Actions tab.
#
# The request is a real (RLS-filtered) query against the sightings table, so it
# exercises Postgres/PostgREST and returns 200 when the project is healthy. If
# it ever returns a non-2xx (e.g. the project is actually paused), the job fails
# and GitHub notifies you — so this doubles as an uptime check.

on:
  schedule:
    # Daily at 07:23 UTC. The odd minute avoids top-of-hour GitHub cron
    # congestion. Daily (vs the original every-2-days) resets the 7-day
    # inactivity timer from a fresh start every day, giving the keep-alive the
    # best chance of registering as activity.
    - cron: "23 7 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi
          echo "Pinging Supabase REST API..."
          set +e
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/sightings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          curl_exit=$?
          set -e
          echo "curl exit: $curl_exit | HTTP: ${code:-none}"
          # curl 6/7 = host won't resolve / connection refused. Supabase drops a
          # paused project's DNS, so a failure to connect almost always means the
          # project is PAUSED — and the ping cannot wake it.
          if [ "$curl_exit" -ne 0 ] || [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Couldn't reach the project — Supabase has almost certainly PAUSED it. Un-pause it from the dashboard; a keep-alive ping cannot wake a paused project."
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase ping returned HTTP $code — the project may be paused or misconfigured."
            exit 1
          fi
          echo "Supabase is awake and responding (HTTP $code)."

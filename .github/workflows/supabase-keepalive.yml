name: Supabase keep-alive

# Keeps the Supabase Free-tier project from being paused for inactivity.
#
# Two failure modes this guards against, learned the hard way:
#   1. The project pauses if it stops receiving requests. The `ping` job hits a
#      real (RLS-filtered) query against the sightings table twice a day, which
#      exercises Postgres/PostgREST and returns 200 when healthy. A non-2xx (or
#      an unresolvable host — Supabase drops a paused project's DNS) fails the
#      job, so this also doubles as an uptime alert.
#   2. GitHub auto-disables *scheduled* workflows after 60 days of repo
#      inactivity — which is what silently killed this cron once. The
#      `keep-cron-enabled` job pushes a tiny empty commit whenever the repo has
#      been quiet for 45 days, resetting that 60-day clock so the schedule
#      never gets switched off again.
#
# NOTE: a keep-alive ping cannot WAKE an already-paused project — the project
# must be un-paused once from the Supabase dashboard, after which this keeps it up.

on:
  schedule:
    # Twice daily (07:23 and 19:23 UTC). The odd minute avoids top-of-hour cron
    # congestion; twice a day leaves margin if GitHub skips or delays a run.
    - cron: "23 7,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # keep-cron-enabled pushes the periodic keep-active commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi
          echo "Pinging Supabase REST API..."
          set +e
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/sightings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          curl_exit=$?
          set -e
          echo "curl exit: $curl_exit | HTTP: ${code:-none}"
          # curl 6/7 = host won't resolve / connection refused. Supabase drops a
          # paused project's DNS, so a failure to connect almost always means the
          # project is PAUSED — and the ping cannot wake it.
          if [ "$curl_exit" -ne 0 ] || [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Couldn't reach the project — Supabase has almost certainly PAUSED it. Un-pause it from the dashboard; a keep-alive ping cannot wake a paused project."
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase ping returned HTTP $code — the project may be paused or misconfigured."
            exit 1
          fi
          echo "Supabase is awake and responding (HTTP $code)."

  keep-cron-enabled:
    # GitHub disables scheduled workflows after 60 days of repo inactivity.
    # Push an empty commit once the last commit is 45+ days old so that never
    # happens. [skip ci] keeps it from triggering CI or a Vercel deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit if the repo has been quiet for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was $age_days day(s) ago."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
            git push
            echo "Pushed keep-active commit to reset the 60-day timer."
          else
            echo "Repo active recently — no keep-active commit needed."
          fi
